<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios DOM</title>
</head>
<body>

    <h1>Questão 1</h1>
    <h2 id="texto">Olá, mundo!</h2>
    <button id="butao">Mudar Título</button>

    <h1>Questão 2</h1>
    <button id="btncor">Mudar o Fundo da Página</button>

    <h1>Questão 3</h1>
    <p id="paragrafo">JavaScript permite modificar elementos da página.</p>
    <button id="btnTexto">Mudar cor</button>

    <h1>Questão 4</h1>
    <p id="mensagem">Feijão com farinha</p>
    <button id="btnEsconder">Mostra/Esconder</button>

    <h1>Questão 5</h1>
    <p id="contagem">0</p>
    <button id="btnAdicionar">Adicionar</button>

    <h1>Questão 6</h1>
    <input type="text" id="nome">
    <h2 id="resultado"></h2>
    <button id="btnMostranome">Mostrar Nome</button>

    <h1>Questão 7</h1>
    <img id="imagem" src="imagem1.jpg" width="300">
    <button id="btnImagem">Trocar imagem</button>

    <h1>Questão 8</h1>
    <p id="textoTamanho">Este texto pode mudar de tamanho.</p>
    <button id="btnAumentar">Aumentar texto</button>

    <h1>Questão 9</h1>
    <button id="btnAdicionarItem">Adicionar item</button>
    <ul id="lista"></ul>

    <script src="DOM.js"></script>
